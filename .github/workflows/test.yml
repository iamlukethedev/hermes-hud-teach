name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unittest-macos:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run stdlib tests
        env:
          PYTHONPATH: .
        run: python -m unittest discover -s tests -v

  unittest-linux-overlay:
    # Exercises the real Tk overlay daemon headlessly: draw a lesson, read state back, clear.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - name: Install Xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Python with Tk
        run: uv python install 3.12
      - name: Run tests under Xvfb
        env:
          PYTHONPATH: .
        run: |
          PY="$(uv python find 3.12)"
          "$PY" -c "import tkinter; print('Tk', tkinter.TkVersion)"
          xvfb-run -a -s "-screen 0 1440x900x24" "$PY" -m unittest discover -s tests -v

  hermes-validate:
    # The same check the Hermes plugin catalog runs at admission.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          path: plugin
      - uses: astral-sh/setup-uv@v6
      - name: Install Hermes Agent from main (locked dependencies)
        env:
          UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/hermes
        run: |
          git clone --depth 1 https://github.com/NousResearch/hermes-agent.git hermes-agent
          cd hermes-agent && uv sync --frozen --no-dev --python 3.14
      - name: hermes plugins validate
        env:
          HERMES_HOME: ${{ runner.temp }}/hermes-home
        run: |
          mkdir -p "$HERMES_HOME"
          "$RUNNER_TEMP/hermes/bin/hermes" plugins validate ./plugin --install-deps
      - name: hermes plugins doctor
        env:
          HERMES_HOME: ${{ runner.temp }}/hermes-home
        run: '"$RUNNER_TEMP/hermes/bin/hermes" plugins doctor ./plugin --ci'
