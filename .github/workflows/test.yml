name: tests

on:
  push:
  pull_request:

jobs:
  unittest:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run stdlib tests
        env:
          PYTHONPATH: .
        run: python -m unittest discover -s tests -v
